name: Feature request
description: "Propose a capability, an API change, or a documentation improvement"
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before proposing a capability, check docs/api-contract.md sections 3.5 and 4. Some things
        this package will never do (preventing a screenshot), and some are deliberately unclaimed
        (`device-pending`, `notMeasured`). A proposal that contradicts the capability table needs a
        measurement, not stronger wording.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: "Describe the situation you are in, not the API you have in mind."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like ScreenGuard to do?
      description: "Which row of the capability table (docs/api-contract.md section 4) does this add to or change?"
    validations:
      required: true
  - type: textarea
    id: measurement
    attributes:
      label: How could it be measured?
      description: "The capture path, the command, and the control band that would rule out a false positive. A capability claim without a measurement and a control is a defect (CONTRIBUTING.md section 1)."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: "Including any documented limitation this proposal would not change."
    validations:
      required: false
  - type: checkboxes
    id: confirmations
    attributes:
      label: Before you file
      options:
        - label: "This proposal does not depend on the package preventing a screenshot or a recording — iOS does not permit an app to do that."
          required: true
        - label: "I have not assumed the private-API path (the PrivateAPI trait) becomes the default."
          required: true
